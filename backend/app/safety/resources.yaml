# MAINTAINED BY HUMANS ONLY. The agent never writes to this file.
# An entry is shown ONLY when `verified_on` is set to the date a person
# confirmed every number and link still works. Entries with verified_on: null
# are ignored, and Kin falls back to "contact local emergency services".
#
# The values below are a starting point, NOT verified by a person yet.
# Check each one, then set verified_on (YYYY-MM-DD).
countries:
